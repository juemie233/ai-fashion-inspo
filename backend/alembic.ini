# Alembic migration config. DB URL is set dynamically in alembic/env.py
# from app.config.settings (synchronous SQLite). Run from the backend dir:
#   alembic upgrade head
#   alembic revision --autogenerate -m "message"
#   alembic current

[alembic]
script_location = alembic

# Add the backend dir to sys.path so env.py can import the app package
prepend_sys_path = .

# Left empty on purpose; env.py overrides it with a synchronous SQLite URL
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
