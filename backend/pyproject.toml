# ruff 静态检查配置（安装：pip install ruff，运行：cd backend && ruff check app）
#
# 规则集保持保守：E/W（pycodestyle）、F（pyflakes 死代码/未用导入）、
# B（bugbear 常见 bug）、UP（pyupgrade 现代化写法，含 3.9+ 类型语法）。
# 暂不启用 I（import 排序）与 ANN（强制注解），避免大面积格式噪音。

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP"]
# E501 行宽由格式化工具统一处理，不在 lint 中告警
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# 迁移脚本允许裸 except（兜底补列时不让单个异常中断启动）
# 注：原先写的 B902 不是 ruff 实现的规则（属 flake8-bugbear 独有），
# 新版 ruff 会以 "Unknown rule selector" 直接拒绝整份配置，导致 ruff check 不可用
"app/db_migrations.py" = ["E722"]
# 任务执行器再导出层：这里刻意把各 task_runners 的公开符号转发出来（旧调用点
# 仍 import app.services.task_runner），不是未使用导入
"app/services/task_runner.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

# mypy 静态类型检查（安装：pip install mypy，运行：cd backend && mypy app）
#
# 与 CLAUDE.md「类型注解必须（disallow_untyped_defs = True）」一致：
# 强制所有函数/方法/闭包带参数与返回类型注解。第三方库缺 stub 时不报错
# （ignore_missing_imports），避免 SQLAlchemy/playwright 等依赖噪音淹没真正问题。
[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true
# 暂不把 Any 当错误（渐进清理）；返回 Any 仅告警提示
warn_return_any = false
disallow_any_generics = false
warn_unused_ignores = true
