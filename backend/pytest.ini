[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -q -n auto --strict-markers -m "not slow"
filterwarnings =
    # P2：ResourceWarning 不再全局静默；默认显示，已知用例单独标记过滤
    default::ResourceWarning
    ignore:Please use `import python_multipart` instead:PendingDeprecationWarning
    ignore:Deprecated in 0\.9\.0:DeprecationWarning

markers =
    slow: 长耗时用例（子进程/迁移/真实模型探测），快速子集用 -m "not slow" 排除
    integration: 跨模块链路/旅程用例，需要完整应用与临时数据库
