name: CI

# 质量门禁：push / PR 到主分支时自动执行前端 lint+类型+测试 与 后端全量测试。
# 任何一步失败即标红，把「人肉漏检」变成「机器必抓」。
#
# 开发阶段约定：项目当前仅在本地运行（npm run dev + uvicorn），尚未进入
# 部署阶段，CI 不做产物构建（vite build）——只保留能抓问题的 lint / 类型
# 检查 / 单测，避免为用不上的产物构建付出维护成本（构建还会依赖 python
# 注入 schema 版本，进一步增加 CI 复杂度）。进入部署阶段后再加回 build。

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  web:
    name: Web 前端（lint / 类型检查 / 测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: 单元测试（vitest）
        run: npm test

      - name: 类型检查（vue-tsc，不产出构建产物）
        run: npm run type-check

  backend:
    name: 后端（pytest 全量）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装依赖（运行依赖 + 测试依赖）
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          # CI 不装 hnswlib：其官方 manylinux wheel 携带 AVX 系编译标记，部分
          # runner CPU 不支持，import 即 SIGILL（exit 132）杀死 pytest 进程，
          # 且 SIGILL 无法在进程内捕获，源码重编译也无法保证覆盖所有 runner。
          # 聚类服务对 hnswlib 缺失有 o2 降级路径（O(n²) 分块矩阵，测试规模
          # 完全够用），CI 走降级路径验证聚类算法逻辑；hnsw 主路径在本地 /
          # 生产环境（wheel 与 CPU 匹配）真实运行。
          pip uninstall -y hnswlib

      # 测试使用临时数据库/临时存储（项目约定），不触碰真实数据；
      # 真实爬虫 / Ollama / face-service 依赖外部环境的用例在 CI 中走 mock。
      - name: pytest 全量
        run: python -m pytest -q --tb=long 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}

      # 失败时把完整 pytest 输出上传为 artifact，便于下载排查
      - name: 上传 pytest 日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: backend/pytest.log
          retention-days: 7
