name: CI

# 质量门禁：push / PR 到主分支时自动执行，与本地 `scripts/test.sh` 对齐。
#   前端 job：ESLint（棘轮）+ vitest + vue-tsc + 死代码基线（ts-prune，只拦新增）
#   后端 job：ruff（零告警）+ vulture（死代码）+ mypy 棘轮 + 迁移链自检（空库 → 与 ORM 一致）
#             + 脚本规范（只读连接 / argparse）+ pytest 全量 + 覆盖率棘轮（≥81%）
#   移动端 job：tsc 类型检查 + jest-expo 单测（含「非 <Text> 节点下不许有裸字符串」的断言，
#             专门防只有原生 RN 才会拦的白屏；Jest 里不校验，所以用自建断言补齐）
# 任何一步失败即标红，把「人肉漏检」变成「机器必抓」。
#
# ⚠️ 注意两个 job 都设了 `defaults.run.working-directory`（web / backend），
# 需要仓库根相对路径的步骤必须显式写 `working-directory: ${{ github.workspace }}`，
# 否则会去找 web/scripts 或 backend/scripts 而报「No such file」（2026-10-28 踩过）。
#
# ⚠️ 只有 GitHub 镜像会触发本工作流：`origin` 指向 gitee，gitee 侧没有 CI。
# 所以推 gitee 前请先在本地跑 `bash scripts/test.sh`——那是唯一能在推送前拦住问题的门。
#
# 开发阶段约定：项目当前仅在本地运行（npm run dev + uvicorn），尚未进入
# 部署阶段，CI 不做产物构建（vite build）——只保留能抓问题的 lint / 类型
# 检查 / 单测，避免为用不上的产物构建付出维护成本（构建还会依赖 python
# 注入 schema 版本，进一步增加 CI 复杂度）。进入部署阶段后再加回 build。

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  web:
    name: Web 前端（lint / 类型检查 / 测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: 单元测试（vitest）
        run: npm test

      - name: 类型检查（vue-tsc，不产出构建产物）
        run: npm run type-check

      - name: 死代码基线（ts-prune，只拦新增）
        run: node ../scripts/check-web-dead-code.mjs

  mobile:
    name: 移动端（tsc / jest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # 移动端依赖存在 peer 冲突（RNTL 12 需要 React 18），与本地安装方式保持一致
      - name: 安装依赖
        run: npm ci --legacy-peer-deps

      - name: 类型检查（tsc）
        run: npm run type-check

      - name: 单元测试（jest-expo + RNTL）
        run: npm test

  backend:
    name: 后端（lint / 迁移 / pytest 全量）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装依赖（运行依赖 + 测试依赖）
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          # CI 不装 hnswlib：其官方 manylinux wheel 携带 AVX 系编译标记，部分
          # runner CPU 不支持，import 即 SIGILL（exit 132）杀死 pytest 进程，
          # 且 SIGILL 无法在进程内捕获，源码重编译也无法保证覆盖所有 runner。
          # 聚类服务对 hnswlib 缺失有 o2 降级路径（O(n²) 分块矩阵，测试规模
          # 完全够用），CI 走降级路径验证聚类算法逻辑；hnsw 主路径在本地 /
          # 生产环境（wheel 与 CPU 匹配）真实运行。
          pip uninstall -y hnswlib

      # 后端 lint：与本地 `scripts/test.sh` 同一道门禁（存量已于 2026-10 清零）
      - name: ruff（零告警：app + 脚本目录）
        run: python -m ruff check app scripts ../scripts

      # 后端死代码：置信度 80 下必须 0 条（2026-10 已清零，见 docs/代码检查.md）
      - name: vulture（死代码）
        run: python -m vulture app --min-confidence 80

      # 后端类型：mypy 棘轮（只查已清零的模块，清单在 scripts/check_types.py）。
      # 全仓存量约 370 个类型错误，一次性清零不现实；棘轮保证「新代码不再欠债」，
      # 每修好一个模块就往清单里加一行。
      - name: mypy 棘轮（类型检查）
        run: python scripts/check_types.py

      # 迁移链自检：临时空库 → `alembic upgrade head` → 结构必须与 ORM 一致。
      # 为什么必须在 CI 跑：本地建库走 create_all + stamp head，迁移链平时不执行，
      # 「空库跑不通 / 空库少约束」只有在这里才暴露（2026-10-20 就是这样发现链尾
      # 对齐迁移撞索引、以及漏了 12 处 NOT NULL/唯一索引的）。全程用临时库，不碰真实数据。
      - name: 迁移链自检（空库 → 与 ORM 一致）
        run: python scripts/check_fresh_migrations.py

      # 脚本目录的静态守卫：只读用途的 sqlite 连接必须 mode=ro（f2 的外部库不能被
      # 脚本以读写方式打开），入口必须用 argparse。scripts 不计覆盖率，只能静态兜。
      #
      # ⚠️ 必须显式指定工作目录：本 job 的默认 `working-directory: backend`，
      # 直接写 `python scripts/check_scripts.py` 会去找 backend/scripts/...（不存在）
      # 而整步报 exit 2（2026-10-28 实测）。校验脚本在**仓库根**的 scripts/ 下。
      - name: 脚本规范（只读连接 / CLI 入口）
        working-directory: ${{ github.workspace }}
        run: python scripts/check_scripts.py

      # 测试使用临时数据库/临时存储（项目约定），不触碰真实数据；
      # 真实爬虫 / Ollama / face-service 依赖外部环境的用例在 CI 中走 mock。
      # 覆盖率是**棘轮底线**（只能往上调，当前 81.7%）：测试被误删/跳过时这里会红。
      - name: pytest 全量 + 覆盖率棘轮（≥81%）
        run: |
          python -m pytest -q --tb=long --cov --cov-fail-under=81 \
            --cov-report=term:skip-covered 2>&1 | tee pytest.log
          exit ${PIPESTATUS[0]}

      # 失败时把完整 pytest 输出上传为 artifact，便于下载排查
      - name: 上传 pytest 日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: backend/pytest.log
          retention-days: 7
