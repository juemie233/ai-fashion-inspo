name: CI

# 质量门禁：push / PR 到主分支时自动执行，与本地 `scripts/ci/test.sh` 对齐。
#
# 与本地一致，CI 也是**按改动范围裁剪**的（2026-11-26 起）：
#   changes job 先算「这次改了哪几类文件」，其余 job 只在命中时运行。
#   - 只改后端 → backend job；只改前端 → web job；只改 docs → docs job；
#   - 只改 scripts/ 或 .github/ → 轻量 scripts job（不装后端依赖）；
#   - 无法识别的文件 / 识别失败 → 回退全量（安全兜底）。
#   完全没命中任何 job 的改动（如只改 README）只跑 changes job，整体为绿。
#
# Job 分工：
#   changes     改动范围识别（scripts/ci/gate_scope.py，本地门禁同一份逻辑）
#   backend     ruff 零告警 + vulture + mypy 棘轮 + 迁移链自检 + 脚本规范
#               + pytest 全量 + 覆盖率棘轮（≥82.9%）+ 关键模块地板
#               + 文档生成物一致性（API参考 / 数据模型 / 配置项参考）
#   web         ESLint（棘轮）+ vitest + vue-tsc + 死代码基线（ts-prune，只拦新增）
#   mobile      tsc 类型检查 + jest-expo 单测（含「非 <Text> 节点下不许有裸字符串」断言）
#   subprojects browser-extension 纯函数测试 / face-service 存储层测试（按改动拆分）
#   docs        docs/ 改动但后端未动时，只校验文档生成物（纯 AST，秒级）
#   scripts     scripts/ 或 .github/ 改动时，只跑脚本规范 + ruff + 门禁计划自检
#
# 任何一步失败即标红，把「人肉漏检」变成「机器必抓」。
#
# ⚠️ web / backend / mobile 三个 job 都设了 `defaults.run.working-directory`，
# 需要仓库根相对路径的步骤必须显式写 `working-directory: ${{ github.workspace }}`，
# 否则会去找 web/scripts 或 backend/scripts 而报「No such file」（2026-10-28 踩过）。
#
# ⚠️ 只有 GitHub 镜像会触发本工作流：`origin` 指向 gitee，gitee 侧没有 CI。
# 推送 gitee 前请先在本地跑 `bash scripts/ci/test.sh`（默认按改动裁剪）——
# 那是唯一能在推送前拦住问题的门。发版/大改前建议 `--all` 跑满 15 项。
#
# 开发阶段约定：项目当前仅在本地运行（npm run dev + uvicorn），尚未进入
# 部署阶段，CI 不做产物构建（vite build）——只保留能抓问题的 lint / 类型
# 检查 / 单测，避免为用不上的产物构建付出维护成本。

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # 手动触发 = 全量门禁（适合发版前或怀疑裁剪漏项时）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: 改动范围识别
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      web: ${{ steps.plan.outputs.web }}
      mobile: ${{ steps.plan.outputs.mobile }}
      subprojects: ${{ steps.plan.outputs.subprojects }}
      browser_ext: ${{ steps.plan.outputs.browser_ext }}
      face_service: ${{ steps.plan.outputs.face_service }}
      docs: ${{ steps.plan.outputs.docs }}
      scripts: ${{ steps.plan.outputs.scripts }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须取全历史：要按 base commit 做 git diff 判断改动范围
          fetch-depth: 0

      # 识别失败时不让依赖 job 全被跳过：plan.outcome 为 failure 时 outputs 为空，
      # 下游条件统一写 `!= 'false'`，空值即视为「照常全跑」（安全兜底）。
      - name: 计算改动范围（scripts/ci/gate_scope.py）
        id: plan
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/ci/gate_scope.py --all --format=github-output >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "对比基准：$BASE"
          python3 scripts/ci/gate_scope.py --base "$BASE" --no-worktree --format=github-output >> "$GITHUB_OUTPUT"

      - name: 识别失败提示
        if: steps.plan.outcome == 'failure'
        run: echo "::warning::改动范围识别失败，本 workflow 回退为全量执行（安全兜底）"

  web:
    name: Web 前端（lint / 类型检查 / 测试）
    needs: changes
    if: always() && needs.changes.outputs.web != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: 单元测试 + 覆盖率（vitest）
        run: npm run test:coverage

      - name: 类型检查（vue-tsc，不产出构建产物）
        run: npm run type-check

      - name: 死代码基线（ts-prune，只拦新增）
        run: node ../scripts/ci/check-web-dead-code.mjs

      - name: Vue 组件零引用检查
        run: node ../scripts/ci/check-web-unused-components.mjs

  mobile:
    name: 移动端（tsc / jest）
    needs: changes
    if: always() && needs.changes.outputs.mobile != 'false'
    runs-on: ubuntu-latest
    # 固定 UTC：与后端 job 一致，也让「本地 +08:00 全绿、CI 挂」的时区差异在本地可复现
    # （2026-11-12 就有一个把 UTC 字面量写进断言的用例栽在这里）。
    env:
      TZ: UTC
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # 移动端依赖存在 peer 冲突（RNTL 12 需要 React 18），与本地安装方式保持一致
      - name: 安装依赖
        run: npm ci --legacy-peer-deps

      - name: 类型检查（tsc）
        run: npm run type-check

      - name: 单元测试 + 覆盖率（jest-expo + RNTL）
        run: npm run test:coverage

  backend:
    name: 后端（lint / 迁移 / pytest 全量）
    needs: changes
    if: always() && needs.changes.outputs.backend != 'false'
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装依赖（运行依赖 + 测试依赖）
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          # CI 不装 hnswlib：其官方 manylinux wheel 携带 AVX 系编译标记，部分
          # runner CPU 不支持，import 即 SIGILL（exit 132）杀死 pytest 进程，
          # 且 SIGILL 无法在进程内捕获，源码重编译也无法保证覆盖所有 runner。
          # 聚类服务对 hnswlib 缺失有 o2 降级路径（O(n²) 分块矩阵，测试规模
          # 完全够用），CI 走降级路径验证聚类算法逻辑；hnsw 主路径在本地 /
          # 生产环境（wheel 与 CPU 匹配）真实运行。
          pip uninstall -y hnswlib

      # 后端 lint：与本地 `scripts/ci/test.sh` 同一道门禁（存量已于 2026-10 清零）
      - name: ruff（零告警：app + 脚本目录）
        run: python -m ruff check app scripts ../scripts

      # 后端死代码：置信度 80 下必须 0 条（2026-10 已清零，见 docs/archive/代码检查.md）
      - name: vulture（死代码）
        run: python -m vulture app --min-confidence 80

      # 后端类型：mypy 棘轮（只查已清零的模块，清单在 scripts/check_types.py）。
      # 全仓存量约 370 个类型错误，一次性清零不现实；棘轮保证「新代码不再欠债」。
      - name: mypy 棘轮（类型检查）
        run: python scripts/check_types.py

      # 迁移链自检：临时空库 → `alembic upgrade head` → 结构必须与 ORM 一致。
      - name: 迁移链自检（空库 → 与 ORM 一致）
        run: python scripts/check_fresh_migrations.py

      # 脚本目录的静态守卫：只读用途的 sqlite 连接必须 mode=ro，入口必须用 argparse。
      # ⚠️ 必须显式指定工作目录：本 job 默认 `working-directory: backend`，
      # 直接写 `python scripts/ci/check_scripts.py` 会去找 backend/scripts/...（不存在）。
      - name: 脚本规范（只读连接 / CLI 入口）+ 门禁计划自检
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/ci/check_scripts.py
          python scripts/ci/gate_scope.py --self-test

      # 文档生成物：docs/overview 下的 API参考 / 数据模型 / 配置项参考 由代码生成。
      # 手改文档、或改了 router/model/config 却忘了重跑生成器，都会在这里红。
      - name: 文档生成物一致性（API / 数据模型 / 配置项）
        working-directory: ${{ github.workspace }}
        run: python scripts/data/gen_docs_from_code.py --check

      # 覆盖率是**棘轮底线**（只能往上调）：测试被误删/跳过时这里会红。
      - name: pytest 全量 + 覆盖率棘轮（≥82.9%）
        run: |
          python -m pytest -q --tb=long --cov --cov-fail-under=82 \
            --cov-report=term:skip-covered 2>&1 | tee pytest.log
          exit ${PIPESTATUS[0]}

      # 失败时把完整 pytest 输出上传为 artifact，便于下载排查
      - name: 上传 pytest 日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: backend/pytest.log
          retention-days: 7

  subprojects:
    name: 子项目（浏览器插件 / 人脸子服务）
    needs: changes
    if: always() && needs.changes.outputs.subprojects != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只有 browser-extension/ 改动才跑插件测试（全量触发时两个都跑）
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.browser_ext != 'false'
        with:
          node-version: 20

      - name: 浏览器插件纯函数测试
        if: needs.changes.outputs.browser_ext != 'false'
        run: node --test browser-extension/test-extract-images.mjs

      # 只有 face-service/ 改动才装人脸子服务依赖（onnxruntime 安装很慢）
      - if: needs.changes.outputs.face_service != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 人脸子服务存储层测试
        if: needs.changes.outputs.face_service != 'false'
        working-directory: face-service
        run: |
          python -m pip install --upgrade pip
          # 依赖清单以 requirements.txt 为唯一真源：测试会 import app.router（人脸推理模块）
          # 验证注册/匹配/删除，需要的包必须与生产一致。这里只把 GPU 版运行时换成 CPU 版
          # （runner 无 CUDA），其余照 requirements 装。
          #
          # ⚠️ 不要退回「手写包名清单」：2026-11-12 CI 就因此变红——router 里有 File(...)
          # 端点，requirements.txt 声明了 python-multipart，而手写清单漏了它；新版 FastAPI
          # 把 multipart 校验提前到**导入时**，于是整个 test_storage.py 导入失败
          # （RuntimeError: Form data requires "python-multipart"），报错信息完全看不出是缺依赖。
          #
          # 版本号也不再手写：requirements.txt 已精确锁版本（与生产 venv 一致），
          # CPU 版运行时直接复用 GPU 版同一版本号，保持单一真源。
          grep -v '^onnxruntime-gpu' requirements.txt > /tmp/face-requirements-cpu.txt
          CPU_ONNX="$(sed -n 's/^onnxruntime-gpu==//p' requirements.txt)"
          pip install -r /tmp/face-requirements-cpu.txt "onnxruntime==${CPU_ONNX}"
          python -m unittest -q test_storage.py

  docs:
    name: 文档生成物（docs-only 改动）
    needs: changes
    if: always() && needs.changes.outputs.docs != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 生成器是纯 AST（不 import app），因此不需要装后端依赖
      - name: 文档生成物一致性（API / 数据模型 / 配置项）
        run: python scripts/data/gen_docs_from_code.py --check

  scripts:
    name: 脚本与门禁配置（轻量）
    needs: changes
    if: always() && needs.changes.outputs.scripts != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 ruff（脚本目录 lint 用，不装后端运行依赖）
        run: python -m pip install --upgrade pip ruff
      - name: 脚本规范（只读连接 / CLI 入口）
        run: python scripts/ci/check_scripts.py
      - name: 门禁计划自检
        run: python scripts/ci/gate_scope.py --self-test
      - name: ruff（scripts + backend/scripts）
        working-directory: backend
        run: python -m ruff check scripts ../scripts
